[project]
name = "wine-crawler"
version = "0.1.0"
description = "Wine catalog crawler and data import service for Vinedetect."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "pwdlib[argon2]",
    "psycopg[binary]",
    "Pillow>=10.0",
    "PyJWT",
    "python-dotenv",
    "python-multipart",
    "pydantic",
    "tenacity",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
