[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vinedetect-retrieval"
version = "0.1.0"
description = "Frozen SigLIP2 official contest retrieval baseline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.3",
  "numpy==2.3.5",
  "Pillow==12.0.0",
  "psycopg[binary]==3.2.12",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.8"]

[project.scripts]
vinedetect-retrieval = "vinedetect_retrieval.cli:main"
vinedetect-training-data = "vinedetect_retrieval.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.package-data]
vinedetect_retrieval = ["field_review.html", "training_relationships.json"]
