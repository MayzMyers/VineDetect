name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vinedetect_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vinedetect_web/package-lock.json
      - run: npm ci
      - run: npm run test:recognition && npm run test:references && npm run test:scanner && npm run test:workflow
      - run: npm run build
  recognize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recognize-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recognize-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run build
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e './vinedetect_api[dev]'
      - run: python -m pytest -q vinedetect_api/tests/test_official_slug_lookup.py vinedetect_api/tests/test_reference_keywords.py vinedetect_api/tests/test_catalog_read_model.py
